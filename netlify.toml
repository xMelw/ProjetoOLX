[build]
  # Pasta do frontend
  base = "Projecto_2S_Front_End"

  # Instala as dependências e faz o build
  command = "npm install && npx vite build"

  # Pasta de publicação gerada pelo Vite (relativa ao base)
  publish = "dist"

# Proxy para o backend no Render (tem de vir ANTES do redirect do SPA)
[[redirects]]
  from = "/api/*"
  to = "https://projeto-olx-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Redirecionamento obrigatório para o Router do React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200