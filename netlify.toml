[build]
  # Pasta do frontend
  base = "Projecto_2S_Front_End"
  
  # Força o Netlify a ignorar o package.json e a compilar o Vite diretamente
  command = "npx vite build"
  
  # Pasta de publicação gerada pelo Vite
  publish = "dist"

# Redirecionamento obrigatório para o Router do React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200